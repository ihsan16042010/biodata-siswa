<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biodata Siswa & Guru</title>

  <!-- Font Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #eef2f7;
      --kartu: #ffffff;
      --teks: #14213d;
      --teks-redup: #5b667a;
      --garis: #d6dde8;
      --aksen: #1d4ed8;
      --aksen-hover: #1e40af;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1522;
        --kartu: #172033;
        --teks: #e8edf6;
        --teks-redup: #98a4ba;
        --garis: #2a3650;
        --aksen: #3b82f6;
        --aksen-hover: #60a5fa;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--teks);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .wadah { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    header h1 { margin: 0 0 4px; font-size: 1.75rem; font-weight: 800; }
    header p  { margin: 0; color: var(--teks-redup); }

    /* Tombol Utama */
    .btn {
      font: inherit;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: var(--aksen);
      color: white;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--aksen-hover); }
    .btn-batal { background: transparent; color: var(--teks-redup); border: 1px solid var(--garis); }
    .btn-batal:hover { background: var(--garis); color: var(--teks); }

    /* Kolom pencarian dan filter */
    .kontrol { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0 8px; }
    .kontrol input, .kontrol select {
      font: inherit;
      color: var(--teks);
      background: var(--kartu);
      border: 1px solid var(--garis);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .kontrol input  { flex: 1 1 220px; }
    .kontrol select { flex: 0 1 160px; }
    .kontrol input:focus-visible, .kontrol select:focus-visible {
      outline: 2px solid var(--aksen);
      outline-offset: 1px;
    }

    .jumlah { color: var(--teks-redup); font-size: 0.9rem; margin: 0 0 16px; }

    /* Susunan kartu */
    .daftar {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    /* Kartu */
    .kartu {
      background: var(--kartu);
      border: 1px solid var(--garis);
      border-radius: 14px;
      overflow: hidden;
    }
    .pita { height: 56px; background: hsl(var(--hue) 65% 45%); }
    .isi  { padding: 0 16px 16px; text-align: center; }

    .foto {
      width: 76px; height: 76px;
      margin: -38px auto 8px;
      border-radius: 50%;
      border: 4px solid var(--kartu);
      background: hsl(var(--hue) 55% 88%);
      color: hsl(var(--hue) 65% 28%);
      display: grid; place-items: center;
      font-weight: 800; font-size: 1.5rem;
      overflow: hidden;
    }
    .foto img { width: 100%; height: 100%; object-fit: cover; }

    .nama { margin: 0; font-size: 1.05rem; font-weight: 800; }
    .nis  { margin: 0 0 12px; color: var(--teks-redup); font-size: 0.85rem; }

    .rincian { margin: 0; text-align: left; font-size: 0.9rem; }
    .rincian div {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 6px 0; border-top: 1px solid var(--garis);
    }
    .rincian dt { color: var(--teks-redup); }
    .rincian dd { margin: 0; font-weight: 600; text-align: right; }

    .pesan {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 16px;
      color: var(--teks-redup);
    }
    .pesan.galat { color: #b42318; }
    @media (prefers-color-scheme: dark) { .pesan.galat { color: #ff8b80; } }

    /* Modal Form Tambah Data */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.aktif {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      background: var(--kartu);
      border: 1px solid var(--garis);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .modal h2 { margin: 0 0 16px; font-size: 1.25rem; }
    .form-grup { margin-bottom: 14px; text-align: left; }
    .form-grup label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: var(--teks-redup); }
    .form-grup input, .form-grup select, .form-grup textarea {
      width: 100%;
      font: inherit;
      color: var(--teks);
      background: var(--bg);
      border: 1px solid var(--garis);
      border-radius: 8px;
      padding: 8px 12px;
    }
    .form-grup textarea { resize: vertical; min-height: 60px; }
    .modal-aksi { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  </style>
</head>

<body>
  <div class="wadah">
    <header>
      <div>
        <h1>Biodata Siswa</h1>
        <p>Cari siswa berdasarkan nama atau NIS.</p>
      </div>
      <button id="btnBukaModal" class="btn">+ Tambah Data</button>
    </header>

    <div class="kontrol">
      <input id="cari" type="search" placeholder="Cari nama atau NIS" aria-label="Cari nama atau NIS">
      <select id="filterKelas" aria-label="Filter kelas">
        <option value="">Semua kelas</option>
      </select>
    </div>

    <p id="jumlah" class="jumlah" aria-live="polite"></p>
    <main id="daftar" class="daftar"></main>
  </div>

  <!-- Modal Form Tambah Data -->
  <div id="modalTambah" class="modal-overlay">
    <div class="modal">
      <h2>Tambah Data Baru</h2>
      <form id="formTambah">
        <!-- Pilihan Tipe Data (Siswa / Guru) -->
        <div class="form-grup">
          <label for="pilihKategori">Pilih Kategori *</label>
          <select id="pilihKategori" required>
            <option value="siswa">Siswa</option>
            <option value="guru">Guru</option>
          </select>
        </div>

        <div class="form-grup">
          <label id="labelNomorInduk" for="inputNomor">NIS *</label>
          <input type="text" id="inputNomor" required>
        </div>

        <div class="form-grup">
          <label for="inputNama">Nama Lengkap *</label>
          <input type="text" id="inputNama" required>
        </div>

        <div class="form-grup" id="grupKelasMapel">
          <label id="labelKelasMapel" for="inputKelasMapel">Kelas *</label>
          <input type="text" id="inputKelasMapel" placeholder="Misal: X IPA 1" required>
        </div>

        <div class="form-grup">
          <label for="inputJk">Jenis Kelamin</label>
          <select id="inputJk">
            <option value="">-- Pilih --</option>
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
          </select>
        </div>
        <div class="form-grup">
          <label for="inputTglLahir">Tanggal Lahir</label>
          <input type="date" id="inputTglLahir">
        </div>
        <div class="form-grup">
          <label for="inputAlamat">Alamat</label>
          <textarea id="inputAlamat" rows="2"></textarea>
        </div>
        <div class="form-grup">
          <label for="inputFotoUrl">URL Foto (Opsional)</label>
          <input type="url" id="inputFotoUrl" placeholder="https://domain.com/foto.jpg">
        </div>
        <div class="modal-aksi">
          <button type="button" id="btnTutupModal" class="btn btn-batal">Batal</button>
          <button type="submit" id="btnSimpan" class="btn">Simpan Data</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Library Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  <script>
    // ---------- LANGKAH 1: PENGATURAN ----------
    const SUPABASE_URL = "https://duqqssfzfajwetcqdggs.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_lVMkRCx0284LlawcC_mXrQ_v6o-VQEz";

    const TAMPILKAN = {
      jenisKelamin: true,
      tanggalLahir: false,
      alamat: false
    };

    // ---------- LANGKAH 2: HUBUNGKAN KE SUPABASE ----------
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Elemen Halaman Utama
    const elDaftar = document.getElementById("daftar");
    const elJumlah = document.getElementById("jumlah");
    const elCari = document.getElementById("cari");
    const elKelas = document.getElementById("filterKelas");

    // Elemen Modal & Form
    const elModal = document.getElementById("modalTambah");
    const elBtnBukaModal = document.getElementById("btnBukaModal");
    const elBtnTutupModal = document.getElementById("btnTutupModal");
    const elFormTambah = document.getElementById("formTambah");
    const elBtnSimpan = document.getElementById("btnSimpan");
    
    // Elemen Dinamis Form
    const elPilihKategori = document.getElementById("pilihKategori");
    const elLabelNomorInduk = document.getElementById("labelNomorInduk");
    const elInputNomor = document.getElementById("inputNomor");
    const elLabelKelasMapel = document.getElementById("labelKelasMapel");
    const elInputKelasMapel = document.getElementById("inputKelasMapel");

    let semuaSiswa = [];

    // Ubah label form berdasarkan kategori (Siswa / Guru)
    elPilihKategori.addEventListener("change", (e) => {
      const kategori = e.target.value;
      if (kategori === "siswa") {
        elLabelNomorInduk.textContent = "NIS *";
        elInputNomor.placeholder = "";
        elLabelKelasMapel.textContent = "Kelas *";
        elInputKelasMapel.placeholder = "Misal: X IPA 1";
      } else {
        elLabelNomorInduk.textContent = "NIP / ID *";
        elInputNomor.placeholder = "Misal: 19850101...";
        elLabelKelasMapel.textContent = "Mata Pelajaran / Jabatan *";
        elInputKelasMapel.placeholder = "Misal: Matematika / Wali Kelas";
      }
    });

    // ---------- LANGKAH 3: AMBIL DATA ----------
    async function muatData() {
      tampilkanPesan("Memuat data siswa...");

      const { data, error } = await db
        .from("siswa")
        .select("nis, nama, kelas, jenis_kelamin, tanggal_lahir, alamat, foto_url")
        .order("nama");

      if (error) {
        console.error(error);
        tampilkanPesan(
          "Data tidak bisa dimuat. Periksa URL dan anon key, nama tabel, serta policy RLS di Supabase.",
          true
        );
        return;
      }

      semuaSiswa = data;
      isiPilihanKelas();
      tampilkanSiswa();
    }

    // ---------- LANGKAH 4: TAMPILKAN KARTU ----------
    function tampilkanSiswa() {
      const kataKunci = elCari.value.trim().toLowerCase();
      const kelasDipilih = elKelas.value;

      const hasil = semuaSiswa.filter((s) => {
        const cocokKelas = !kelasDipilih || s.kelas === kelasDipilih;
        const cocokCari =
          !kataKunci ||
          s.nama.toLowerCase().includes(kataKunci) ||
          s.nis.toLowerCase().includes(kataKunci);
        return cocokKelas && cocokCari;
      });

      elJumlah.textContent = hasil.length + " dari " + semuaSiswa.length + " siswa";
      elDaftar.replaceChildren();

      if (hasil.length === 0) {
        tampilkanPesan(
          semuaSiswa.length === 0
            ? "Belum ada data siswa. Klik '+ Tambah Data' untuk menambahkan."
            : "Tidak ada siswa yang cocok. Coba kata kunci atau kelas lain."
        );
        return;
      }

      hasil.forEach((s) => elDaftar.appendChild(buatKartu(s)));
    }

    function buatKartu(s) {
      const kartu = el("article", "kartu");
      kartu.style.setProperty("--hue", warnaKelas(s.kelas));

      kartu.appendChild(el("div", "pita"));

      const isi = el("div", "isi");

      const foto = el("div", "foto");
      if (s.foto_url) {
        const gambar = document.createElement("img");
        gambar.src = s.foto_url;
        gambar.alt = "Foto " + s.nama;
        gambar.loading = "lazy";
        gambar.onerror = () => foto.replaceChildren(document.createTextNode(inisial(s.nama)));
        foto.appendChild(gambar);
      } else {
        foto.textContent = inisial(s.nama);
      }
      isi.appendChild(foto);

      isi.appendChild(el("h2", "nama", s.nama));
      isi.appendChild(el("p", "nis", "NIS " + s.nis));

      const rincian = el("dl", "rincian");
      tambahBaris(rincian, "Kelas", s.kelas);
      if (TAMPILKAN.jenisKelamin) tambahBaris(rincian, "Jenis kelamin", s.jenis_kelamin);
      if (TAMPILKAN.tanggalLahir) tambahBaris(rincian, "Tanggal lahir", formatTanggal(s.tanggal_lahir));
      if (TAMPILKAN.alamat) tambahBaris(rincian, "Alamat", s.alamat);
      isi.appendChild(rincian);

      kartu.appendChild(isi);
      return kartu;
    }

    // ---------- LANGKAH 5: TAMBAH DATA (INSERT SUPABASE) ----------
    async function simpanData(e) {
      e.preventDefault();

      const kategori = elPilihKategori.value;
      const nomorInduk = elInputNomor.value.trim();
      const nama = document.getElementById("inputNama").value.trim();
      const kelasMapel = elInputKelasMapel.value.trim();
      const jenisKelamin = document.getElementById("inputJk").value || null;
      const tanggalLahir = document.getElementById("inputTglLahir").value || null;
      const alamat = document.getElementById("inputAlamat").value.trim() || null;
      const fotoUrl = document.getElementById("inputFotoUrl").value.trim() || null;

      elBtnSimpan.disabled = true;
      elBtnSimpan.textContent = "Menyimpan...";

      let errorSupabase = null;

      if (kategori === "siswa") {
        const dataSiswa = {
          nis: nomorInduk,
          nama: nama,
          kelas: kelasMapel,
          jenis_kelamin: jenisKelamin,
          tanggal_lahir: tanggalLahir,
          alamat: alamat,
          foto_url: fotoUrl
        };
        const { error } = await db.from("siswa").insert([dataSiswa]);
        errorSupabase = error;
      } else {
        const dataGuru = {
          nip: nomorInduk,
          nama: nama,
          mapel: kelasMapel,
          jenis_kelamin: jenisKelamin,
          tanggal_lahir: tanggalLahir,
          alamat: alamat,
          foto_url: fotoUrl
        };
        const { error } = await db.from("guru").insert([dataGuru]);
        errorSupabase = error;
      }

      elBtnSimpan.disabled = false;
      elBtnSimpan.textContent = "Simpan Data";

      if (errorSupabase) {
        console.error(errorSupabase);
        alert("Gagal menyimpan data: " + errorSupabase.message);
        return;
      }

      elFormTambah.reset();
      elPilihKategori.value = "siswa"; // Reset ke default
      elPilihKategori.dispatchEvent(new Event('change')); // Trigger event text label
      tutupModal();

      await muatData();
    }

    // ---------- MANAJEMEN MODAL ----------
    function bukaModal() { elModal.classList.add("aktif"); }
    function tutupModal() { elModal.classList.remove("aktif"); }

    // ---------- FUNGSI BANTU ----------
    function el(tag, kelas, teks) {
      const e = document.createElement(tag);
      if (kelas) e.className = kelas;
      if (teks) e.textContent = teks;
      return e;
    }

    function tambahBaris(dl, label, nilai) {
      if (!nilai) return;
      const baris = el("div");
      baris.appendChild(el("dt", "", label));
      baris.appendChild(el("dd", "", nilai));
      dl.appendChild(baris);
    }

    function inisial(nama) {
      return nama.split(" ").filter(Boolean).slice(0, 2)
        .map((k) => k[0].toUpperCase()).join("");
    }

    function warnaKelas(kelas) {
      let total = 0;
      for (const huruf of kelas || "") total += huruf.charCodeAt(0);
      return (total * 47) % 360;
    }

    function formatTanggal(teks) {
      if (!teks) return "";
      return new Date(teks + "T00:00:00").toLocaleDateString("id-ID", {
        day: "numeric", month: "long", year: "numeric"
      });
    }

    function tampilkanPesan(teks, galat) {
      elDaftar.replaceChildren(el("p", "pesan" + (galat ? " galat" : ""), teks));
    }

    function isiPilihanKelas() {
      const opsiLama = elKelas.querySelector('option[value=""]');
      elKelas.replaceChildren(opsiLama);
      
      const daftarKelas = [...new Set(semuaSiswa.map((s) => s.kelas).filter(Boolean))].sort();
      daftarKelas.forEach((k) => {
        const opsi = el("option", "", k);
        opsi.value = k;
        elKelas.appendChild(opsi);
      });
    }

    // ---------- EVENT LISTENERS ----------
    elCari.addEventListener("input", tampilkanSiswa);
    elKelas.addEventListener("change", tampilkanSiswa);
    elBtnBukaModal.addEventListener("click", bukaModal);
    elBtnTutupModal.addEventListener("click", tutupModal);
    elFormTambah.addEventListener("submit", simpanData);

    elModal.addEventListener("click", (e) => {
      if (e.target === elModal) tutupModal();
    });

    muatData();
  </script>
</body>
</html>
